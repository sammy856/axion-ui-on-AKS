trigger: none

pool: 
  vmImage: ubuntu-latest

stages:
    - stage: buildandpush
      displayName: build and push stage
      jobs:
          - job: buildandpush
            displayName: build and push job
            steps:
              - task: Docker@2
                inputs:
                  containerRegistry: 'ACR service Connection'
                  repository: 'axion-ui'
                  command: 'buildAndPush'
                  Dockerfile: '**/Dockerfile'

    - stage: deploytoaksstage
      displayName: deploy to aks stage
      jobs:
        - job: depploytoaksjob
          displayName: deploy to aks job
          steps: 
            - task: KubernetesManifest@1
              inputs:
                action: 'deploy'
                connectionType: 'kubernetesServiceConnection'
                kubernetesServiceConnection: 'aks srv connection'
                namespace: 'Default'
                manifests: |
                  $(Build.SourcesDirectory)/manifest/deployment.yml
                  $(Build.SourcesDirectory)/manifest/service.yml
                             
   

